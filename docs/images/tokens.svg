  <defs><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <rect width="900" height="250" rx="16" fill="#0f172a"/>
    <text x="32" y="42" font-size="20" font-weight="700" fill="#f1f5f9">New project + orders feature, same request, same model</text>
    <circle cx="39" cy="66" r="6" fill="#34d399"/><text x="52" y="71" font-size="14" fill="#cbd5e1">with skills</text>
    <circle cx="149" cy="66" r="6" fill="#64748b"/><text x="162" y="71" font-size="14" fill="#cbd5e1">without</text>
    <g font-size="15" fill="#cbd5e1"><text x="32" y="112">Tokens</text><text x="32" y="162">Tool calls</text><text x="32" y="212">Minutes</text></g>
    <g>
