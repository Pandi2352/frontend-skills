      <rect x="140" y="140" width="156" height="14" rx="4" fill="url(#a)"/><rect x="140" y="157" width="625" height="14" rx="4" fill="#64748b"/>
      <rect x="140" y="190" width="337" height="14" rx="4" fill="url(#a)"/><rect x="140" y="207" width="625" height="14" rx="4" fill="#64748b"/>
    </g>
    <g font-size="14" font-weight="700" fill="#f1f5f9">
      <text x="458" y="102">55k</text><text x="775" y="119">111k</text>
      <text x="304" y="152">9</text><text x="775" y="169">36</text>
      <text x="485" y="202">6.3</text><text x="775" y="219">11.7</text>
