# Put inside the server block. Change root and API as needed.
root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
# With the Brotli module: brotli on; brotli_types <the same list>;

# Hashed names, so they never change. A missing file is a real 404.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Build information is not for visitors.
location /.vite/ {
    return 404;
}

# Every other path is the app.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
}
